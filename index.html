<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Corporate English Training Directory & Interactive Professional Exercises">
    <title>Enterprise English Learning Resources</title>
    <style>
        :root {
            --bg-main: #f8fafc;
            --surface: #ffffff;
            --primary: #1e293b;
            --primary-accent: #2563eb;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --border-hover: #cbd5e1;
            --card-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
            --card-hover-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.5;
            padding: 30px 20px;
        }

        .app-container {
            max-width: 1280px;
            margin: 0 auto;
        }

        /* Executive Header */
        header {
            background: var(--primary);
            color: #ffffff;
            padding: 32px 40px;
            border-radius: 12px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header-title h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .header-title p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-top: 4px;
        }

        /* Metric Indicators */
        .metrics-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .metric-card {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 8px;
            box-shadow: var(--card-shadow);
        }

        .metric-card .value {
            font-size: 1.85rem;
            font-weight: 700;
            color: var(--primary);
        }

        .metric-card .label {
            font-size: 0.825rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-weight: 600;
            margin-top: 2px;
        }

        /* Search & Control Panel */
        .controls-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .search-bar {
            width: 100%;
        }

        .search-bar input {
            width: 100%;
            padding: 10px 16px;
            font-size: 0.95rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-bar input:focus {
            border-color: var(--primary-accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .filter-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            min-width: 90px;
        }

        .filter-options {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-filter {
            background: #f1f5f9;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-filter:hover {
            background: #e2e8f0;
        }

        .btn-filter.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        /* Directory Grid */
        .directory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .module-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            text-decoration: none;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.2s ease;
            box-shadow: var(--card-shadow);
        }

        .module-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
            box-shadow: var(--card-hover-shadow);
        }

        .module-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 16px;
            line-height: 1.35;
        }

        .module-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border);
            padding-top: 12px;
            margin-top: auto;
        }

        .category-tag {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* CEFR Badges */
        .cefr-badge {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 4px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .badge-a1, .badge-a2 { background: #dcfce7; color: #166534; }
        .badge-b1, .badge-b2 { background: #dbeafe; color: #1e40af; }
        .badge-c1, .badge-c2 { background: #f3e8ff; color: #6b21a8; }
        .badge-general { background: #f1f5f9; color: #475569; }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            background: var(--surface);
            border: 1px dashed var(--border);
            border-radius: 8px;
            color: var(--text-muted);
        }

        @media (max-width: 640px) {
            header { padding: 20px; }
            .filter-group { flex-direction: column; align-items: flex-start; }
            .filter-label { min-width: auto; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="header-title">
            <h1>Corporate English Learning Hub</h1>
            <p>Professional Language Training & Assessment Directory</p>
        </div>
    </header>

    <div class="metrics-row">
        <div class="metric-card">
            <div class="value" id="totalModules">0</div>
            <div class="label">Total Modules</div>
        </div>
        <div class="metric-card">
            <div class="value" id="visibleModules">0</div>
            <div class="label">Filtered Modules</div>
        </div>
        <div class="metric-card">
            <div class="value">CEFR A1–C2</div>
            <div class="label">Proficiency Spectrum</div>
        </div>
    </div>

    <div class="controls-panel">
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search modules by title or filename...">
        </div>
        
        <div class="filter-group">
            <span class="filter-label">Level:</span>
            <div class="filter-options" id="cefrFilters">
                <button class="btn-filter active" data-cefr="all">All</button>
                <button class="btn-filter" data-cefr="A1">A1</button>
                <button class="btn-filter" data-cefr="A2">A2</button>
                <button class="btn-filter" data-cefr="B1">B1</button>
                <button class="btn-filter" data-cefr="B2">B2</button>
                <button class="btn-filter" data-cefr="C1">C1/C2</button>
            </div>
        </div>

        <div class="filter-group">
            <span class="filter-label">Category:</span>
            <div class="filter-options" id="categoryFilters">
                <button class="btn-filter active" data-category="all">All</button>
                <button class="btn-filter" data-category="Professional">Professional</button>
                <button class="btn-filter" data-category="Vocabulary">Vocabulary</button>
                <button class="btn-filter" data-category="Grammar">Grammar</button>
                <button class="btn-filter" data-category="Assessment">Assessment</button>
            </div>
        </div>
    </div>

    <main class="directory-grid" id="directoryGrid"></main>
</div>

<script>
    // Hardcoded fallback database (includes all screenshot items & fixes broken links)
    const staticManifest = [
        { file: "accounting-problem-1.html", title: "Accounting Problem 1", category: "Professional", cefr: "B1" },
        { file: "accounting-problem-2.html", title: "Accounting Problem 2", category: "Professional", cefr: "B1" },
        { file: "accounting-problem-3.html", title: "Accounting Problem 3", category: "Professional", cefr: "B2" },
        { file: "accounting-vocab-b1.html", title: "Accounting Vocab B1", category: "Vocabulary", cefr: "B1" },
        { file: "accounting-vocabulary-b2.html", title: "Accounting Vocabulary B2", category: "Vocabulary", cefr: "B2" },
        { file: "always-still.html", title: "Always & Still", category: "Grammar", cefr: "B1" },
        { file: "atlantic-crossing-conditionals.html", title: "Atlantic Crossing Conditionals", category: "Grammar", cefr: "B1" },
        { file: "cars-a2.html", title: "Automotive Industry Terms", category: "Vocabulary", cefr: "A2" },
        { file: "conditional-professional-b1.html", title: "Conditional Professional Contexts", category: "Professional", cefr: "B1" },
        { file: "conditionals-a2.html", title: "Conditionals A2", category: "Grammar", cefr: "A2" },
        { file: "conditionals-b1.html", title: "Conditionals B1", category: "Grammar", cefr: "B1" },
        { file: "countries-nationalities-a2.html", title: "Countries & Nationalities", category: "Vocabulary", cefr: "A2" },
        { file: "defining-relative-clauses.html", title: "Defining Relative Clauses", category: "Grammar", cefr: "B1" },
        { file: "describing-change-b1.html", title: "Describing Trends & Change", category: "Grammar", cefr: "B1" },
        { file: "dimensions-vocab-test.html", title: "Dimensions & Measurements", category: "Vocabulary", cefr: "B1" },
        { file: "electrical-motor-sales-proposal.html", title: "Electrical Motor Sales Proposal", category: "Professional", cefr: "B2" },
        { file: "fasteners-a2.html", title: "Industrial Fasteners Vocabulary", category: "Vocabulary", cefr: "A2" },
        { file: "financial-overview-b1.html", title: "Financial Overview B1", category: "Professional", cefr: "B1" },
        { file: "gb-us-vocab-b1.html", title: "UK vs US Business Vocab", category: "Vocabulary", cefr: "B1" },
        { file: "grammar-challenge-a1.html", title: "Grammar Challenge A1", category: "Grammar", cefr: "A1" },
        { file: "grammar-challenge-a2.html", title: "Grammar Challenge A2", category: "Grammar", cefr: "A2" },
        { file: "grammar-challenge-b1.html", title: "Grammar Challenge B1", category: "Grammar", cefr: "B1" },
        { file: "grammar-challenge-b2.html", title: "Grammar Challenge B2", category: "Grammar", cefr: "B2" },
        { file: "grammar-challenge-advanced.html", title: "Grammar Challenge Advanced", category: "Grammar", cefr: "C1" },
        { file: "grammar-challenge-multi-2.html", title: "Grammar Challenge Intermediate", category: "Grammar", cefr: "B1" },
        { file: "grammar-challenge.html", title: "Grammar Challenge Master", category: "Grammar", cefr: "B2" },
        { file: "hotel-vocabulary.html", title: "Hospitality Vocabulary", category: "Vocabulary", cefr: "A2" },
        { file: "indias-pharma-revolution.html", title: "India's Pharma Revolution", category: "Professional", cefr: "B2" },
        { file: "industrial-security-vocab.html", title: "Industrial Security Vocab", category: "Vocabulary", cefr: "B1" },
        { file: "innovative-product-design.html", title: "Innovative Product Design", category: "Professional", cefr: "B2" },
        { file: "it_insurance_system-down-b1.html", title: "IT Incident & System Down", category: "Professional", cefr: "B1" },
        { file: "lab-equipment-comparison.html", title: "Lab Equipment Comparison", category: "Vocabulary", cefr: "B1" },
        { file: "logistics-vocabulary-exercises.html", title: "Logistics & Supply Chain Vocab", category: "Vocabulary", cefr: "B1" },
        { file: "meeting-language-b1.html", title: "Meeting Language B1", category: "Professional", cefr: "B1" },
        { file: "meeting-language.html", title: "Effective Meeting Language", category: "Professional", cefr: "B1" },
        { file: "motor-industry-affixes-b1 B1.html", title: "Motor Industry Affixes", category: "Vocabulary", cefr: "B1" },
        { file: "negotiation-b1.html", title: "Commercial Negotiation B1", category: "Professional", cefr: "B1" },
        { file: "negotiation-b2.html", title: "Advanced Negotiation B2", category: "Professional", cefr: "B2" },
        { file: "office-a2.html", title: "Office Environment Vocab", category: "Vocabulary", cefr: "A2" },
        { file: "office-vocabulary-a2.html", title: "Office Equipment & Workflow", category: "Vocabulary", cefr: "A2" },
        { file: "organise-a-meeting-a2.html", title: "Organising Meetings A2", category: "Professional", cefr: "A2" },
        { file: "organise-a-meeting-b1.html", title: "Organising Meetings B1", category: "Professional", cefr: "B1" },
        { file: "past-simple-quiz-a2.html", title: "Past Simple Quiz", category: "Grammar", cefr: "A2" },
        { file: "pharmacy-b2.html", title: "Pharmaceutical Terminology", category: "Vocabulary", cefr: "B2" },
        { file: "phrasal-verbs-at-work-b1.html", title: "Workplace Phrasal Verbs B1", category: "Professional", cefr: "B1" },
        { file: "phrasal-verbs-at-work-b1+.html", title: "Workplace Phrasal Verbs B1+", category: "Professional", cefr: "B2" },
        { file: "placement-test-2.html", title: "Comprehensive Placement Test", category: "Assessment", cefr: "A1-C2" },
        { file: "present-continuous-quiz-a2.html", title: "Present Continuous Quiz", category: "Grammar", cefr: "A2" },
        { file: "present-simple-passive.html", title: "Present Simple Passive", category: "Grammar", cefr: "B1" },
        { file: "product-design.html", title: "Product Design Specification", category: "Professional", cefr: "B1" },
        { file: "professional-vocabulary-b2.html", title: "Executive Vocabulary B2", category: "Vocabulary", cefr: "B2" },
        { file: "rhyme-quiz.html", title: "Pronunciation & Rhymes", category: "Vocabulary", cefr: "A2" },
        { file: "safety-signs-modals-a2.html", title: "Safety Signs & Modals", category: "Professional", cefr: "A2" },
        { file: "supply-planner.html", title: "Supply Chain Planner Scenario", category: "Professional", cefr: "B2" },
        { file: "tech-vocab-a2.html", title: "Technical Vocab A2", category: "Vocabulary", cefr: "A2" },
        { file: "tools-whats-it-for-a2.html", title: "Tools & Equipment Usage", category: "Vocabulary", cefr: "A2" },
        { file: "travelling-phrasal-verbs.html", title: "Travel Phrasal Verbs", category: "Grammar", cefr: "B1" },
        { file: "uk-us-vocab-b1.html", title: "UK/US English Terminology", category: "Vocabulary", cefr: "B1" },
        { file: "will-vs-going-to.html", title: "Future Tenses: Will vs Going To", category: "Grammar", cefr: "A2" }
    ];

    let allModules = [...staticManifest];
    let selectedCefr = "all";
    let selectedCategory = "all";

    // Automatic metadata metadata generator for dynamic files
    function deriveMetadata(filename) {
        const lower = filename.toLowerCase();
        let cefr = "General";
        if (lower.includes("-a1")) cefr = "A1";
        else if (lower.includes("-a2")) cefr = "A2";
        else if (lower.includes("-b1+")) cefr = "B2";
        else if (lower.includes("-b1")) cefr = "B1";
        else if (lower.includes("-b2")) cefr = "B2";
        else if (lower.includes("-c1")) cefr = "C1";

        let category = "Professional";
        if (lower.includes("vocab") || lower.includes("fastener") || lower.includes("car") || lower.includes("rhyme")) {
            category = "Vocabulary";
        } else if (lower.includes("grammar") || lower.includes("quiz") || lower.includes("passive") || lower.includes("conditional")) {
            category = "Grammar";
        } else if (lower.includes("test") || lower.includes("placement")) {
            category = "Assessment";
        }

        const title = filename
            .replace(".html", "")
            .replace(/[-_]/g, " ")
            .replace(/\b\w/g, c => c.toUpperCase());

        return { file: filename, title, category, cefr };
    }

    // Auto-fetch newly added HTML files directly from GitHub API
    async function syncWithGitHub() {
        try {
            const pathSegments = window.location.pathname.split('/').filter(Boolean);
            const repoOwner = window.location.hostname.split('.')[0];
            const repoName = pathSegments[0];

            if (!repoOwner || !repoName) return;

            const response = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/`);
            if (!response.ok) return;

            const files = await response.json();
            const htmlFiles = files.filter(f => f.name.endsWith('.html') && f.name !== 'index.html');

            const existingFiles = new Set(allModules.map(m => m.file));
            htmlFiles.forEach(file => {
                if (!existingFiles.has(file.name)) {
                    allModules.push(deriveMetadata(file.name));
                }
            });

            render();
        } catch (err) {
            console.log("GitHub API live sync skipped; using manifest fallback.", err);
        }
    }

    function render() {
        const grid = document.getElementById("directoryGrid");
        const searchTerm = document.getElementById("searchInput").value.toLowerCase();

        const filtered = allModules.filter(mod => {
            const matchesSearch = mod.title.toLowerCase().includes(searchTerm) || mod.file.toLowerCase().includes(searchTerm);
            const matchesCefr = selectedCefr === "all" || mod.cefr.toUpperCase().includes(selectedCefr);
            const matchesCategory = selectedCategory === "all" || mod.category === selectedCategory;
            return matchesSearch && matchesCefr && matchesCategory;
        });

        document.getElementById("totalModules").textContent = allModules.length;
        document.getElementById("visibleModules").textContent = filtered.length;

        grid.innerHTML = "";

        if (filtered.length === 0) {
            grid.innerHTML = `<div class="empty-state">No matching learning modules found.</div>`;
            return;
        }

        filtered.forEach(mod => {
            const badgeClass = `badge-${mod.cefr.toLowerCase().replace(/[^a-z0-9]/g, '')}` || 'badge-general';
            const card = document.createElement("a");
            card.className = "module-card";
            card.href = mod.file;
            card.innerHTML = `
                <div class="module-title">${mod.title}</div>
                <div class="module-meta">
                    <span class="category-tag">${mod.category}</span>
                    <span class="cefr-badge ${badgeClass}">${mod.cefr}</span>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function setupEventListeners() {
        document.getElementById("searchInput").addEventListener("input", render);

        document.getElementById("cefrFilters").addEventListener("click", e => {
            if (!e.target.classList.contains("btn-filter")) return;
            document.querySelectorAll("#cefrFilters .btn-filter").forEach(b => b.classList.remove("active"));
            e.target.classList.add("active");
            selectedCefr = e.target.dataset.cefr;
            render();
        });

        document.getElementById("categoryFilters").addEventListener("click", e => {
            if (!e.target.classList.contains("btn-filter")) return;
            document.querySelectorAll("#categoryFilters .btn-filter").forEach(b => b.classList.remove("active"));
            e.target.classList.add("active");
            selectedCategory = e.target.dataset.category;
            render();
        });
    }

    document.addEventListener("DOMContentLoaded", () => {
        setupEventListeners();
        render();
        syncWithGitHub();
        
        // Prevent default navigation for demonstration if hosted locally without target files
        document.getElementById("directoryGrid").addEventListener("click", (e) => {
            const card = e.target.closest("a");
            if (card && window.location.protocol === "file:") {
                console.log(`Navigating to: ${card.getAttribute("href")}`);
            }
        });
    });
</script>
</body>
</html>
